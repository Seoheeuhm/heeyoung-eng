<!DOCTYPE html>
<html lang="ko">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet"/>

<body data-page="hose.html">
<div class="wrap">
<div id="header-placeholder"></div>
<div class="page-content">
  <div class="prod-page">
    <div class="prod-left">
      <div class="preview-box">
        <div class="pb-head"><h3>배관</h3></div>
        <div class="pb-body">
          <div class="prod-detail">
            <div>
              <div class="pd-img product-photo"><img src="assets/hose-piping.avif" alt="파카 배관 이미지"/></div>
            </div>
            <div class="pd-info">
              <h4>배관 (Piping)</h4>
              <p>희영이엔지는 Parker Hannifin의 금속·플라스틱·불소중합체 등 다양한 소재의 배관 및 튜브를 정품으로 공급합니다. 사용 유체, 압력, 온도 조건을 알려주시면 적합한 배관을 안내해 드립니다.</p>
            </div>
          </div>
        </div>
      </div>

      <div class="preview-box">
        <div class="pb-head"><h3>배관 카테고리</h3></div>
        <div class="pb-body">
          <div class="cat-photo-grid">
            <div class="cat-photo-item"><img src="assets/pipe-metal.avif" alt="금속 배관 이미지"/><span>금속 배관</span></div>
            <div class="cat-photo-item"><img src="assets/pipe-nylon-tube.avif" alt="나일론 튜브 이미지"/><span>나일론 튜브</span></div>
            <div class="cat-photo-item"><img src="assets/pipe-ptfe-tube.avif" alt="PTFE 튜브 이미지"/><span>PTFE 튜브</span></div>

            <div class="cat-photo-item"><img src="assets/pipe-fluoropolymer.avif" alt="불소중합체 배관 이미지"/><span>불소중합체 배관</span></div>
            <div class="cat-photo-item"><img src="assets/pipe-plastic.avif" alt="플라스틱 배관 이미지"/><span>플라스틱 배관</span></div>
            <div class="cat-photo-item"><img src="assets/pipe-polyurethane.webp" alt="폴리우레탄 배관 이미지"/><span>폴리우레탄 배관</span></div>
